server {
    listen 80;
    listen [::]:80;

    server_name _;

    root /var/www/html;
    index index.php index.html;

    charset utf-8;

    client_max_body_size 100M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
    }
    # Laravel runtime/private storage alanları
    location ^~ /storage/framework/ {
        deny all;
    }

    location ^~ /storage/logs/ {
        deny all;
    }

    # Storage içine yüklenen PHP benzeri dosyalar çalıştırılmasın
    location ~* ^/storage/.*\.(php|phtml|phar)$ {
        deny all;
    }

    # Uygulama kaynak kodları dışarıdan erişilemesin
    location ~ ^/(app|bootstrap|config|database|resources|routes|tests|docker)(/|$) {
        deny all;
    }

    # Composer/vendor kaynakları dışarıdan erişilemesin
    location ^~ /vendor/ {
        deny all;
    }

    # Hassas kök dosyaları
    location ~ ^/(artisan|composer\.(json|lock)|package(-lock)?\.json|vite\.config\.js|Dockerfile|phpunit\.xml)$ {
        deny all;
    }
    location ~ \.php$ {
        include fastcgi_params;

        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;

        fastcgi_read_timeout 300;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
